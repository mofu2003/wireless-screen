name: WirelessScreen
options:
  createIntermediateGroups: true
# Sparkle provides signed, out-of-store macOS updates. The appcast and
# release archives are hosted by this repository's GitHub Releases.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
schemes:
  WirelessScreenMac:
    build:
      targets:
        WirelessScreenMac: all
    test:
      targets:
        - WirelessScreenMacTests
  WirelessScreeniOS:
    build:
      targets:
        WirelessScreeniOS: all
  WirelessScreenMacReceiver:
    build:
      targets:
        WirelessScreenMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. Release builds override both via
    # xcargs: MARKETING_VERSION from the release tag and
    # CURRENT_PROJECT_VERSION from a monotonic release counter.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WirelessScreenMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - package: Sparkle
    sources:
      - Mac
      - Shared
      - MacReceiver/MacReceiver.swift
      - MacReceiver/PowerControl.swift
      - MacReceiver/FullscreenPreference.swift
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: 无线副屏通过本地网络连接你的平板、手机或另一台 Mac。
        NSBonjourServices: ["_opensidecar._tcp", "_od-sender._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 mofu2003. 基于 OpenDisplay，按 GPL-3.0 分发。"
        SUFeedURL: https://raw.githubusercontent.com/mofu2003/wireless-screen/refs/heads/main/public/appcast.xml
        SUPublicEDKey: IY7hnXOd1liMKCB+2PuOkh+4K+39Fl5fX5fAItfTCi0=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mofu2003.wirelessscreen.mac
        PRODUCT_NAME: WirelessScreen
        BUNDLE_DISPLAY_NAME: 无线副屏
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "WirelessScreen".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.mofu2003.wirelessscreen.mac.debug
          PRODUCT_NAME: WirelessScreen Dev
          BUNDLE_DISPLAY_NAME: 无线副屏开发版
          # Colour-inverted icon so the dev build is obvious in the Dock,
          # cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  WirelessScreenMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    dependencies:
      - package: Sparkle
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: 无线副屏接收端通过本地网络被发现，让另一台 Mac 把画面发送到这台 Mac。
        NSBonjourServices: ["_opensidecar._tcp"]
        NSAppleEventsUsageDescription: 无线副屏接收端会在已连接的 Mac 请求时关闭这台 Mac。
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 mofu2003. 基于 OpenDisplay，按 GPL-3.0 分发。"
        SUFeedURL: https://raw.githubusercontent.com/mofu2003/wireless-screen/refs/heads/main/public/appcast-receiver.xml
        SUPublicEDKey: IY7hnXOd1liMKCB+2PuOkh+4K+39Fl5fX5fAItfTCi0=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 21600
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mofu2003.wirelessscreen.mac.receiver
        PRODUCT_NAME: WirelessScreenReceiver
        BUNDLE_DISPLAY_NAME: 无线副屏接收端
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.mofu2003.wirelessscreen.mac.receiver.debug
          PRODUCT_NAME: WirelessScreenReceiver Dev
          BUNDLE_DISPLAY_NAME: 无线副屏接收端开发版
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  WirelessScreenMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/DisplayArrangement.swift
      - Mac/OriginRestore.swift
      - Mac/StreamConfiguration.swift
      - Mac/VirtualCanvasSizing.swift
      - Mac/PhoneInfo.swift
      - Mac/DesktopPolicy.swift
      - Mac/ClickTracker.swift
      - Mac/ReverseConnectionRequest.swift
      - Mac/CaptureSourceCheck.swift
      - Mac/AndroidUSBFunction.swift
      - Mac/USBAccessory.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Shared/Protocol.swift
      - Shared/ProductIdentity.swift
      - Shared/DirectCable.swift
      - Shared/FrameRateOption.swift
      - Shared/LogSnapshot.swift
      - MacReceiver/FullscreenPreference.swift
      - iOS/ReceiverPanelGeometry.swift
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  WirelessScreeniOS:
    type: application
    platform: iOS
    # iOS 15 is the lowest floor Xcode 27's SDK allows and the last stop that
    # revives hardware (iPad Air 2, iPad mini 4, iPhone 6s/7/SE). See #72.
    # Anything newer is used behind #available, never as a floor.
    deploymentTarget: "15.0"
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 无线副屏
        CFBundleName: 无线副屏
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Full screen on iPadOS 26 and earlier, as before. From iOS 27 the
        # app follows its window instead (an iPhone Duo's Split View, iPadOS
        # 27 multitasking); the receiver reports whatever window it gets.
        UIRequiresFullScreen: true
        UIRequiresFullScreenIgnoredStartingWithVersion: "27"
        NSLocalNetworkUsageDescription: 无线副屏通过本地网络被发现，让 Mac 连接并发送画面。
        NSBonjourServices: ["_opensidecar._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mofu2003.wirelessscreen.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
