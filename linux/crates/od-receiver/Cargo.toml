[package]
name = "od-receiver"
description = "WirelessScreen receiver for Linux: turns a Wayland output into a Mac wireless display (PROTOCOL.md pv 3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gstreamer", "gtk", "logind", "dmabuf"]
# Decode and present through GStreamer. Without it only `--sink none` works,
# which is enough for protocol testing on a machine without the dev packages.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]
# The GTK 4 window presenter (fullscreen, input, cursor overlay).
gtk = ["gstreamer", "dep:gtk4", "dep:gst-plugin-gtk4"]
# GTK 4.14 APIs and the fractional monitor scale.
gtk-v4-14 = ["gtk4/v4_14"]
# Zero-copy DMABuf import into GTK 4.14+. Linux release builds targeting
# older RK3576 images leave this off and let GTK convert on the CPU.
dmabuf = ["gtk", "gtk-v4-14", "gst-plugin-gtk4/dmabuf"]
# Tell the sender `sleeping` before a suspend (logind PrepareForSleep).
logind = ["dep:zbus"]

[dependencies]
opendisplay-proto = { workspace = true }
opendisplay-session = { workspace = true }
od-update = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
mdns-sd = { workspace = true }
wayland-client = { workspace = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }
gst-plugin-gtk4 = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
od-fake-sender = { path = "../od-fake-sender" }
