name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: wireless-screen-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1: $TAG" >&2
            exit 1
          }
          git rev-parse "$TAG" >/dev/null
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            [[ "$SUFFIX" =~ ^([0-9]+)$ ]] && VERSION_CODE=$((VERSION_CODE + BASH_REMATCH[1]))
          fi
          printf 'tag=%s\nversion=%s\nversion_code=%s\n' "$TAG" "$VERSION" "$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # Sparkle compares CFBundleVersion; GitHub run numbers are monotonic.
          printf 'build_number=%s\n' "$(( RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-26
    env:
      SPARKLE_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build, sign and package the macOS app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail

          xcodebuild build \
            -project WirelessScreen.xcodeproj \
            -scheme WirelessScreenMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          mkdir -p dist
          SENDER="build/Build/Products/Release/WirelessScreen.app"

          codesign --force --deep --sign - --options runtime \
            --entitlements Mac/OpenSidecarMac.entitlements "$SENDER"
          codesign --verify --deep --strict --verbose=2 "$SENDER"

          ditto -c -k --keepParent "$SENDER" "dist/WirelessScreen-$VERSION.zip"

      - name: Sign the Sparkle archive and generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.WIRELESSSCREEN_SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "WIRELESSSCREEN_SPARKLE_PRIVATE_KEY is not configured" >&2
            exit 1
          }

          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz"
          mkdir -p "$RUNNER_TEMP/Sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle"
          SPARKLE_BIN="$RUNNER_TEMP/Sparkle/bin"

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_private"

          mkdir -p "$RUNNER_TEMP/appcast-sender"
          cp "dist/WirelessScreen-$VERSION.zip" "$RUNNER_TEMP/appcast-sender/"

          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle_ed_private" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            -o "dist/appcast.xml" \
            "$RUNNER_TEMP/appcast-sender"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build and sign Android APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.WIRELESSSCREEN_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WIRELESSSCREEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WIRELESSSCREEN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WIRELESSSCREEN_ANDROID_KEY_PASSWORD }}
        working-directory: Android
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "Android signing secrets are not configured" >&2
            exit 1
          }

          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p ../dist
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out ../dist/WirelessScreen-Android.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../dist/WirelessScreen-Android.apk
          (cd ../dist && sha256sum WirelessScreen-Android.apk > WirelessScreen-Android.apk.sha256)

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: full
            container: ubuntu:24.04
          - arch: x86_64
            runner: ubuntu-24.04
            variant: full
            container: ubuntu:24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
            variant: compat
            container: ubuntu:22.04
          - arch: x86_64
            runner: ubuntu-24.04
            variant: compat
            container: ubuntu:22.04
    name: linux (${{ matrix.arch }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Full: GTK 4.14 window + input on Ubuntu 24.04. Compat: Ubuntu 22.04
      # ABI with waylandsink, for older RK3576 board images without GTK 4.14.
      - name: Build receiver in ${{ matrix.container }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e VERSION -e ARCH -e VARIANT -e OD_GIT_COMMIT="$GITHUB_SHA" \
            -v "$PWD:/src" -w /src/linux \
            "${{ matrix.container }}" bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              packages=(
                ca-certificates curl build-essential pkg-config clang
                libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
                libwayland-dev
              )
              if [[ "$VARIANT" == full ]]; then
                packages+=(libgtk-4-dev)
              fi
              apt-get install -y -qq --no-install-recommends "${packages[@]}"
              curl -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              build=(--locked --release -p od-receiver)
              if [[ "$VARIANT" == compat ]]; then
                build+=(--no-default-features --features gstreamer,logind)
              fi
              OD_RECEIVER_VERSION="$VERSION" cargo build "${build[@]}"
              ./packaging/linux/build-receiver-tarball.sh \
                "$VERSION" "$ARCH" "$VARIANT"
            '

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            dist/WirelessScreenReceiver-*-linux-*.tar.gz
            dist/WirelessScreenReceiver-*-linux-*.tar.gz.sha256
          if-no-files-found: error

  linux-sender:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    name: linux sender (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libwayland-dev nasm git curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Cache static FFmpeg and x264
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-static
          key: ffmpeg-static-${{ runner.arch }}-${{ hashFiles('linux/packaging/ffmpeg/build-static.sh') }}

      - name: Build static FFmpeg and x264
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ffmpeg-static"
          if [[ ! -f "$prefix/rustflags" ]]; then
            linux/packaging/ffmpeg/build-static.sh "$prefix"
          fi

      - name: Build WirelessScreen Sender
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/ffmpeg-static"
          export FFMPEG_DIR="$prefix"
          export RUSTFLAGS="$(cat "$prefix/rustflags")"
          export OD_SENDER_VERSION="$VERSION"
          cd linux
          cargo build --locked --release -p od-sender
          mkdir -p ../dist
          python3 packaging/third-party-licenses.py \
            . "$prefix" > ../dist/THIRD-PARTY-LICENSES.txt

      - name: Package Linux sender
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cd linux
          OD_SENDER_LICENSES="$GITHUB_WORKSPACE/dist/THIRD-PARTY-LICENSES.txt" \
            OD_GIT_COMMIT="$GITHUB_SHA" \
            ./packaging/linux/build-sender-tarball.sh "$VERSION" "$ARCH"

      - name: Upload Linux sender artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-sender-${{ matrix.arch }}
          path: |
            dist/WirelessScreenSender-*-linux-*.tar.gz
            dist/WirelessScreenSender-*-linux-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, macos, android, linux, linux-sender]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes and update manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+\[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          notes = match.group(1).strip() if match else "Initial public release."
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

          python3 - "$VERSION" "$VERSION_CODE" "$TAG" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version, version_code, tag = sys.argv[1:]
          sha = Path("dist/WirelessScreen-Android.apk.sha256").read_text().split()[0]
          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          manifest = {
              "versionCode": int(version_code),
              "versionName": version,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/WirelessScreen-Android.apk",
              "sha256": sha,
              "notes": notes,
          }
          Path("public/android-version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - "$VERSION" "$TAG" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version, tag = sys.argv[1:]
          dist = Path("dist")
          packages = {}

          def checksum(archive: Path) -> str:
              sidecar = archive.with_name(archive.name + ".sha256")
              if not sidecar.is_file():
                  raise SystemExit(f"missing checksum: {sidecar}")
              value = sidecar.read_text(encoding="utf-8").split()[0].lower()
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(f"invalid checksum in {sidecar}")
              return value

          def add(key: str, archive: Path) -> None:
              if key in packages:
                  raise SystemExit(f"duplicate Linux package: {key}")
              packages[key] = {
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{archive.name}",
                  "sha256": checksum(archive),
              }

          for archive in dist.glob("WirelessScreenSender-*.tar.gz"):
              match = re.fullmatch(
                  r"WirelessScreenSender-(.+)-linux-(aarch64|x86_64)\.tar\.gz",
                  archive.name,
              )
              if not match or match.group(1) != version:
                  raise SystemExit(f"unexpected sender archive: {archive.name}")
              add(f"sender-{match.group(2)}", archive)

          for archive in dist.glob("WirelessScreenReceiver-*.tar.gz"):
              match = re.fullmatch(
                  r"WirelessScreenReceiver-(.+)-linux-(aarch64|x86_64)(-compat)?\.tar\.gz",
                  archive.name,
              )
              if not match or match.group(1) != version:
                  raise SystemExit(f"unexpected receiver archive: {archive.name}")
              variant = "compat" if match.group(3) else "full"
              add(f"receiver-{variant}-{match.group(2)}", archive)

          expected = {
              f"sender-{arch}" for arch in ("aarch64", "x86_64")
          } | {
              f"receiver-{variant}-{arch}"
              for variant in ("full", "compat")
              for arch in ("aarch64", "x86_64")
          }
          if set(packages) != expected:
              missing = sorted(expected - set(packages))
              extra = sorted(set(packages) - expected)
              raise SystemExit(f"Linux package set mismatch; missing={missing} extra={extra}")

          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          manifest = {
              "version": version,
              "tag": tag,
              "notes": notes,
              "packages": dict(sorted(packages.items())),
          }
          Path("public/linux-version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/WirelessScreen-Android.apk" \
            "dist/WirelessScreen-Android.apk.sha256" \
            "dist/WirelessScreen-$VERSION.zip" \
            dist/WirelessScreenReceiver-*-linux-*.tar.gz \
            dist/WirelessScreenReceiver-*-linux-*.tar.gz.sha256 \
            dist/WirelessScreenSender-*-linux-*.tar.gz \
            dist/WirelessScreenSender-*-linux-*.tar.gz.sha256 \
            "release-notes.md" \
            --title "无线副屏 $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Publish update feeds
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p public
          cp dist/appcast.xml public/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/android-version.json public/appcast.xml public/linux-version.json
          if git diff --cached --quiet; then
            echo "Update feeds unchanged"
          else
            git commit -m "chore(release): publish wireless screen $TAG feeds [skip ci]"
            git push origin main
          fi
