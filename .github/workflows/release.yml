name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: wireless-screen-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1: $TAG" >&2
            exit 1
          }
          git rev-parse "$TAG" >/dev/null
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            [[ "$SUFFIX" =~ ^([0-9]+)$ ]] && VERSION_CODE=$((VERSION_CODE + BASH_REMATCH[1]))
          fi
          printf 'tag=%s\nversion=%s\nversion_code=%s\n' "$TAG" "$VERSION" "$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # Sparkle compares CFBundleVersion; GitHub run numbers are monotonic.
          printf 'build_number=%s\n' "$(( RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-26
    env:
      SPARKLE_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build, sign and package macOS apps
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail

          xcodebuild build \
            -project WirelessScreen.xcodeproj \
            -scheme WirelessScreenMac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          xcodebuild build \
            -project WirelessScreen.xcodeproj \
            -scheme WirelessScreenMacReceiver \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          mkdir -p dist
          SENDER="build/Build/Products/Release/WirelessScreen.app"
          RECEIVER="build/Build/Products/Release/WirelessScreenReceiver.app"

          codesign --force --deep --sign - --options runtime \
            --entitlements Mac/OpenSidecarMac.entitlements "$SENDER"
          codesign --force --deep --sign - --options runtime \
            --entitlements MacReceiver/OpenSidecarMacReceiver.entitlements "$RECEIVER"
          codesign --verify --deep --strict --verbose=2 "$SENDER"
          codesign --verify --deep --strict --verbose=2 "$RECEIVER"

          ditto -c -k --keepParent "$SENDER" "dist/WirelessScreen-$VERSION.zip"
          ditto -c -k --keepParent "$RECEIVER" "dist/WirelessScreenReceiver-$VERSION.zip"

      - name: Sign Sparkle archives and generate appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.WIRELESSSCREEN_SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "WIRELESSSCREEN_SPARKLE_PRIVATE_KEY is not configured" >&2
            exit 1
          }

          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz"
          mkdir -p "$RUNNER_TEMP/Sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle"
          SPARKLE_BIN="$RUNNER_TEMP/Sparkle/bin"

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_private"
          chmod 600 "$RUNNER_TEMP/sparkle_ed_private"

          mkdir -p "$RUNNER_TEMP/appcast-sender" "$RUNNER_TEMP/appcast-receiver"
          cp "dist/WirelessScreen-$VERSION.zip" "$RUNNER_TEMP/appcast-sender/"
          cp "dist/WirelessScreenReceiver-$VERSION.zip" "$RUNNER_TEMP/appcast-receiver/"

          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle_ed_private" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            -o "dist/appcast.xml" \
            "$RUNNER_TEMP/appcast-sender"
          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$RUNNER_TEMP/sparkle_ed_private" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            -o "dist/appcast-receiver.xml" \
            "$RUNNER_TEMP/appcast-receiver"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build and sign Android APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.WIRELESSSCREEN_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WIRELESSSCREEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WIRELESSSCREEN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WIRELESSSCREEN_ANDROID_KEY_PASSWORD }}
        working-directory: Android
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "Android signing secrets are not configured" >&2
            exit 1
          }

          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p ../dist
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out ../dist/WirelessScreen-Android.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../dist/WirelessScreen-Android.apk
          (cd ../dist && sha256sum WirelessScreen-Android.apk > WirelessScreen-Android.apk.sha256)

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes and Android manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+\[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^##\s+|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          notes = match.group(1).strip() if match else "Initial public release."
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

          python3 - "$VERSION" "$VERSION_CODE" "$TAG" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version, version_code, tag = sys.argv[1:]
          sha = Path("dist/WirelessScreen-Android.apk.sha256").read_text().split()[0]
          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          manifest = {
              "versionCode": int(version_code),
              "versionName": version,
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/WirelessScreen-Android.apk",
              "sha256": sha,
              "notes": notes,
          }
          Path("public/android-version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/WirelessScreen-Android.apk" \
            "dist/WirelessScreen-Android.apk.sha256" \
            "dist/WirelessScreen-$VERSION.zip" \
            "dist/WirelessScreenReceiver-$VERSION.zip" \
            "release-notes.md" \
            --title "无线副屏 $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Publish update feeds
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p public
          cp dist/appcast.xml public/appcast.xml
          cp dist/appcast-receiver.xml public/appcast-receiver.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/android-version.json public/appcast.xml public/appcast-receiver.xml
          if git diff --cached --quiet; then
            echo "Update feeds unchanged"
          else
            git commit -m "chore(release): publish wireless screen $TAG feeds [skip ci]"
            git push origin main
          fi
